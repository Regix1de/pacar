<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Untukmu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card">
    <h1>Untukmu</h1>
    <p class="subtitle">Sedikit energi buat hari-hari sibukmu ♡</p>

    <section class="countdown">
      <h2>Countdown sampai ketemu lagi</h2>
      <div id="count">-- hari -- : -- : -- : --</div>
      <small id="meet-date">Meet: 2026-01-10 10:00</small>
    </section>

    <section class="message">
      <h2>Pesan singkat</h2>
      <p id="note">Fokus dulu urusanmu, aku di sini nggak nambah beban.</p>
    </section>

    <button id="surpriseBtn">Buka Kejutan</button>
    <div id="surprise" class="hidden">Surprise: Kamu hebat. Istirahat kalau bisa.</div>

    <footer>
      <small>Dibuat dengan ♥</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
