<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Untukmu</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div class="wrapper">
  <div class="glass">
    <h1>Untukmu</h1>
    <p class="tag">Sebuah ruang kecil buat kamu istirahat sebentar</p>

    <section class="countdown">
      <h2>Countdown Bertemu</h2>
      <div id="count">-- : -- : -- : --</div>
      <small id="meet-date">Meet: 2026-01-10 10:00</small>
    </section>

    <section class="message">
      <p>Fokus sama duniamu dulu. Aku tetap di sini, tanpa nambahin beban.</p>
    </section>

    <button id="surpriseBtn">Buka Pesan</button>
    <div id="surprise" class="hidden surprise-box">
      Kamu nggak harus kuat terus. Tapi kamu selalu berusaha. Itu cukup.
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
